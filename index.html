<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spider Graph Studio</title>
    <meta name="description" content="Build radar charts and turn them into stat cards. Export as PNG, JPG, SVG or PDF." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 29,11 24,28 8,28 3,11' fill='%23FFC93C' stroke='%231A1C3A' stroke-width='2.5'/%3E%3Cpolygon points='16,9 23,14 20,23 11,22 9,14' fill='%23E5246B'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash light.
      try {
        var t = localStorage.getItem('sgs-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
